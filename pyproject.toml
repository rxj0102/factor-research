[project]
name = "factor-research"
version = "0.1.0"
description = "Research code for factor-research"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "pandas-datareader>=0.10.0",
    "openpyxl>=3.1.0",
    "jupyter>=1.0.0",
    "nbformat>=5.9.0",
    "ipykernel>=6.25.0"
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
